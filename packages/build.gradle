plugins {
    id 'base'
    id 'com.github.node-gradle.node'
}

def pnpmVersionFromPackageJson = providers.provider {
    def packageManager = packageJson.get('packageManager')
    def matcher = (packageManager ?: '') =~ /^pnpm@([^+]+)(?:\+.*)?$/
    if (!matcher.matches()) {
        throw new GradleException("Expected package.json packageManager to be pnpm@<version>, but got: ${packageManager}")
    }
    matcher[0][1]
}

node {
    nodeProjectDir = projectDir
    pnpmVersion.set(pnpmVersionFromPackageJson)
}

tasks.register('pnpmBuild', PnpmTask) {
    group = 'build'
    args = ['run', 'build']
    dependsOn tasks.named('pnpmInstall')
    inputs.files(fileTree(projectDir) {
        include 'ui/**', 'theme-lib/**', 'shiki-code-element/**', 'scripts/**'
        include 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'biome.json'
        exclude '**/node_modules/**', '**/dist/**', '**/build/**'
    })
    inputs.file(rootProject.layout.projectDirectory.file('src/main/resources/plugin.yaml'))
    outputs.dir('ui/build/dist')
    outputs.dir('theme-lib/dist')
    outputs.dir('shiki-code-element/dist')
}

tasks.named('assemble') {
    dependsOn tasks.named('pnpmBuild')
}

tasks.named('clean') {
    delete 'ui/build', 'theme-lib/dist', 'shiki-code-element/dist'
}
