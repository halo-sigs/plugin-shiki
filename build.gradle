plugins {
    id 'java'
    id "com.github.node-gradle.node" version "7.1.0" apply false
    id "io.freefair.lombok" version "9.2.0"
    id "run.halo.plugin.devtools" version "0.8.0"
}

group 'run.halo.shiki'

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('run.halo.tools.platform:plugin:2.25.0')
    compileOnly 'run.halo.app:api'

    testImplementation 'run.halo.app:api'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}

sourceSets.main.resources.exclude 'ui/**', 'console/**', 'static/**'

tasks.named('processResources', Copy) {
    dependsOn project(':packages').tasks.named('pnpmBuild')
    from(project(':packages').layout.projectDirectory.dir('ui/build/dist')) {
        into 'ui'
    }
    from(project(':packages').layout.projectDirectory.dir('theme-lib/dist')) {
        into 'static'
    }
    doFirst {
        delete layout.buildDirectory.dir('resources/main/ui'),
            layout.buildDirectory.dir('resources/main/console'),
            layout.buildDirectory.dir('resources/main/static')
    }
}

tasks.named('clean') {
    dependsOn project(':packages').tasks.named('clean')
}

tasks.named('generatePluginComponentsIdx') {
    notCompatibleWithConfigurationCache('This task invokes "Task.project" at execution time, which is not supported with configuration cache.')
}

halo {
    version = '2.26'
}
